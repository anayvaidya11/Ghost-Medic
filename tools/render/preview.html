<!doctype html>
<!--
  DEV PREVIEW, not part of the site. It mounts site/assets/product-viewer.js on
  its own so the concept can be looked at and iterated on before anything is
  wired into site/index.html.

  Serve the repo root, then open:
    python3 -m http.server 8931
    http://localhost:8931/tools/render/preview.html            on the body
    http://localhost:8931/tools/render/preview.html?wearer=0   devices only
  Extra params:
    ?devices=wrist+phone | wrist+pack | wrist+phone+pack   (default: the shipped set)
    ?preset=figure|wrist|phone|pack|all                    camera preset
    ?az=&el=   orbit the preset's camera to this azimuth/elevation (radians);
               el near 1.4 looks straight down. For screenshots of the angles
               the presets don't cover — a floating part can hide behind its
               mount from the preset view and give itself away from above.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archiater concept preview (dev)</title>
<style>
  :root { --paper:#F4F1E9; --stone:#E8E3D8; --line:#D6CFC0; --ink:#1F241D; --ink-2:#5D655B; --forest:#2C4630;
          --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--stone); color:var(--ink); font:15px/1.5 var(--mono); padding:1.5rem; }
  .wrap { max-width: 58rem; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight:700; margin:0 0 .25rem; }
  .sub { color:var(--ink-2); margin:0 0 1rem; font-size:.8rem; }
  .board-viewer { position:relative; background:var(--paper); border:1px solid var(--line); padding:.5rem; }
  .board-canvas { display:block; width:100%; touch-action:pan-y; cursor:grab; }
  .board-canvas:active { cursor:grabbing; }
  .board-viewer.is-3d .concept-2d { display:none; }
  .board-status { color:var(--ink-2); font-size:.78rem; min-height:1.2em; margin:.5rem 0 0; }
  .bar { display:flex; gap:.5rem; flex-wrap:wrap; margin:0 0 .75rem; }
  .bar a, .bar button {
    font:600 12px var(--mono); color:var(--forest); background:var(--paper);
    border:1px solid var(--line); padding:.4rem .7rem; text-decoration:none; cursor:pointer; }
  .bar a[aria-current="true"] { background:var(--forest); color:var(--paper); border-color:var(--forest); }
  pre { background:var(--paper); border:1px solid var(--line); padding:.75rem; overflow-x:auto;
        font-size:.75rem; margin:1rem 0 0; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Concept preview (dev only)</h1>
  <p class="sub">Not the site. <code>site/index.html</code> is untouched.</p>

  <div class="bar">
    <a id="tab-on"  href="?wearer=1">On the body</a>
    <a id="tab-off" href="?wearer=0">Devices only</a>
    <span id="presets"></span>
    <button id="spin">Toggle spin</button>
  </div>

  <div class="board-viewer" id="product-viewer">
    <p class="concept-2d" style="padding:2rem;text-align:center;color:var(--ink-2)">WebGL fallback would go here.</p>
  </div>
  <p class="board-status" id="product-status" role="status"></p>
  <pre id="diag">measuring...</pre>
</div>

<script type="importmap">
{"imports":{
  "three": "../../site/vendor/three/three.module.min.js",
  "three/addons/": "../../site/vendor/three/addons/"
}}
</script>
<script type="module">
  import * as THREE from 'three';
  import { mountProductViewer, ACTIVE_SET, DEVICE_SETS } from '../../site/assets/product-viewer.js';

  const q = new URLSearchParams(location.search);
  const wearer = q.get('wearer') !== '0';
  const devices = DEVICE_SETS[q.get('devices')] ? q.get('devices') : ACTIVE_SET;
  document.getElementById(wearer ? 'tab-on' : 'tab-off').setAttribute('aria-current', 'true');

  const view = mountProductViewer({
    mount:  document.getElementById('product-viewer'),
    status: document.getElementById('product-status'),
    wearer, devices,
  });

  await view.ready;

  // Screenshots have to be repeatable, so the preview never auto-rotates.
  view.controls.autoRotate = false;

  // Preset chips mirror the viewer's own presets; ?preset= drives them from
  // the screenshot script.
  const chipBox = document.getElementById('presets');
  for (const name of view.presets) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { view.setPreset(name); view.controls.autoRotate = false; measure(); };
    chipBox.appendChild(b);
  }
  const wanted = q.get('preset');
  if (wanted && view.presets.includes(wanted)) view.setPreset(wanted);
  view.controls.autoRotate = false;

  // ?az=&el= re-orbit the camera about the preset's own target and distance.
  if (q.get('az') !== null || q.get('el') !== null) {
    const az = parseFloat(q.get('az') ?? '0');
    const el = Math.min(1.45, parseFloat(q.get('el') ?? '0.1'));
    const t = view.controls.target;
    const r = view.camera.position.distanceTo(t);
    view.camera.position.set(
      t.x + r * Math.cos(el) * Math.sin(az),
      t.y + r * Math.sin(el),
      t.z + r * Math.cos(el) * Math.cos(az));
    view.controls.update();
  }

  document.getElementById('spin').onclick = () => { view.controls.autoRotate = !view.controls.autoRotate; };

  function measure() {
    const lines = [];
    const box = new THREE.Box3();
    const size = new THREE.Vector3();
    const dim = (label, obj) => {
      if (!obj) return;
      box.setFromObject(obj); box.getSize(size);
      lines.push(`${label.padEnd(22)} ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)} mm`);
    };
    lines.push(`device set             ${devices}${devices === ACTIVE_SET ? '  (shipped)' : '  (harness only)'}`);
    dim('wrist unit', view.wristUnit?.group);
    dim('phone', view.phone?.group);
    dim('belt pack', view.beltPack?.group);

    if (view.figure) {
      dim('figure', view.figure.group);
      const d = view.figure.diagnostics;
      lines.push('');
      lines.push(`stature                ${d.statureMm.toFixed(0)} mm  (scale applied ${d.scaleApplied.toFixed(2)}x, flipped ${d.flipped})`);
      lines.push(`figure vertices        ${d.vertexCount}  built in ${d.buildMs} ms`);
      const bore = d.bandBoreMm / 2;
      lines.push(`wrist max radius       ${d.wristRMax.toFixed(1)} mm  (band inner radius ${bore.toFixed(1)}; negative margin = band sunk into skin)`);
      lines.push(`band radial margin     ${(bore - d.wristRMax).toFixed(1)} mm`);
      lines.push(`pack seat radius       ${d.seatRadius.toFixed(1)} mm  (pack inner face is 150.0)`);
      lines.push(`carry mount at         ${d.carryPos.x.toFixed(0)}, ${d.carryPos.y.toFixed(0)}, ${d.carryPos.z.toFixed(0)} mm (hip)`);

      // The cable must not pass through the wearer.
      let cableMin = Infinity;
      for (let i = 0; i <= 200; i++) {
        const p = view.curve.getPoint(i / 200);
        const surf = view.figure.surface.torsoPoint(Math.atan2(p.z, p.x), p.y);
        cableMin = Math.min(cableMin, Math.hypot(p.x, p.z) - Math.hypot(surf.x, surf.z) - 3);
      }
      const straight = view.curve.getPoint(0).distanceTo(view.curve.getPoint(1));
      lines.push(`cable to torso gap     ${cableMin.toFixed(1)} mm  min  (negative = through the body)`);
      lines.push(`cable slack            ${((view.curve.getLength() / straight - 1) * 100).toFixed(0)}% longer than the straight span`);

      // ...and must clear the arm it runs beside (3 = cable radius). The
      // first 45 mm from the boss are exempt: a cable emerging from a
      // wrist-mounted unit is AT the wrist by definition, and counting that
      // as a clip buried the real mid-run numbers this line exists to catch.
      let armMin = Infinity;
      const cableA = view.curve.getPoint(0);
      for (let i = 0; i <= 240; i++) {
        const p = view.curve.getPoint(i / 240);
        if (p.distanceTo(cableA) < 45) continue;
        armMin = Math.min(armMin, view.figure.surface.limbGap(p) - 3);
      }
      lines.push(`cable to arm gap       ${armMin.toFixed(1)} mm  min  (past the lead-out; the lead runs beside the forearm on purpose)`);
    }

    // Marker positions on the canvas.
    view.camera.updateMatrixWorld(true);
    const w = view.canvas.clientWidth, h = view.canvas.clientHeight;
    const px = view.markers.map((s) => {
      const v = s.position.clone().project(view.camera);
      return { x: (v.x * 0.5 + 0.5) * w, y: (-v.y * 0.5 + 0.5) * h };
    });
    lines.push('');
    lines.push(`canvas                 ${w} x ${h} px`);
    px.forEach((p, i) => {
      let near = Infinity, who = '-';
      px.forEach((qq, j) => {
        if (i === j) return;
        const d = Math.hypot(p.x - qq.x, p.y - qq.y);
        if (d < near) { near = d; who = String(j + 1); }
      });
      const off = p.x < 0 || p.y < 0 || p.x > w || p.y > h ? '  OFF-CANVAS' : '';
      lines.push(`marker ${i + 1} at            ${p.x.toFixed(0)}, ${p.y.toFixed(0)} px   nearest #${who} ${near.toFixed(0)} px${off}`);
    });

    document.getElementById('diag').textContent = lines.join('\n');
  }
  measure();
  window.__view = view;      // for headless probing (tools/render scripts)
  window.__ready = true;
</script>
</body>
</html>
